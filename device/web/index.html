<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AIChat Device</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!-- 据え置きの画面なので、上から「状態」「本文」「操作」の順に置く。
         離れて見るものなので文字は大きめ、配色は常に暗い（夜のテーブルで
         白背景は眩しい）。

         **チャットだけを置く。** 実機（Pi + 液晶）に近づけるため、履歴は
         この画面に出さない。読み返すのは別画面（/history）。 -->
    <main id="app">
      <header class="bar">
        <div id="clock" class="clock">--:--</div>
        <div id="badge" class="badge" hidden></div>
        <nav class="actions">
          <a class="link" href="/history">履歴</a>
          <!-- 10 分待たずに仕切り直す唯一の手段。実機には無い。 -->
          <button id="new-chat" class="pill" type="button">新しい会話</button>
          <!-- ON にすると常時待ち受けになり、ウェイクワードでチャットが始まる。 -->
          <button id="mic" class="pill mic" type="button" data-on="0">マイク OFF</button>
        </nav>
      </header>

      <section id="stage" class="stage" data-state="idle">
        <div id="status" class="status">話しかけてください</div>
        <div id="transcript" class="transcript"></div>
        <div id="level" class="level"><span id="level-bar"></span></div>
        <p id="question" class="question" hidden></p>
        <p id="answer" class="answer"></p>
        <ul id="sources" class="sources" hidden></ul>
      </section>

      <footer class="bar bottom">
        <button id="talk" class="talk" type="button">話す</button>
        <div id="model" class="model"></div>
      </footer>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
